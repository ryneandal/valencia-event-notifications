name = "valencia-events-api"
main = "src/index.py"
compatibility_date = "2026-09-04"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]

[triggers]
# Cron expressions are UTC: 08:00 UTC is 09:00 CET / 10:00 CEST in València.
crons = ["0 8 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "valencia-events"
database_id = "3f3abe12-81d8-4f97-ba3b-fd736aca0c20"

[vars]
SESSION_TTL_HOURS = "24"
MAGIC_LINK_TTL_MINUTES = "15"
APP_BASE_URL = "https://valencia-event-notifications.pages.dev"
# Mailgun free sandbox domains can send only to verified Authorized Recipients.
MAILGUN_DOMAIN = "sandboxe1b1d4545c414b7dbd0d502b92281b01.mailgun.org"
MAILGUN_REGION = "us"
EMAIL_FROM = "València Events <postmaster@sandboxe1b1d4545c414b7dbd0d502b92281b01.mailgun.org>"
OPENROUTER_MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free"
DIGEST_DELIVERY_ENABLED = "false"
