name: Nightly Events Digest

on:
  # Run nightly at 8 AM UTC (9/10 AM Madrid time depending on DST)
  schedule:
    - cron: '0 8 * * *'
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: |
          uv sync
      
      # Restore previous database cache if it exists (for deduplication)
      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: events.db
          key: events-db-${{ github.run_id }}
          restore-keys: |
            events-db-
      
      - name: Run scrapers and send digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SUBSCRIBER_BACKEND: d1
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          MISTRAL_FALLBACK_MODEL: ${{ vars.MISTRAL_FALLBACK_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_FALLBACK_MODEL: ${{ vars.OPENROUTER_FALLBACK_MODEL }}
          OPENROUTER_APP_URL: ${{ vars.OPENROUTER_APP_URL }}
          OPENROUTER_APP_TITLE: ${{ vars.OPENROUTER_APP_TITLE }}
        run: |
          uv run python -m valencia_events
      
      # Save database cache for next run (for deduplication)
      - name: Save database cache
        uses: actions/cache/save@v4
        with:
          path: events.db
          key: events-db-${{ github.run_id }}
        if: always()
