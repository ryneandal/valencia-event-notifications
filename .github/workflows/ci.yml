name: CI - Tests and Linting

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: |
          uv sync --extra dev
      
      - name: Run ruff linter
        run: |
          uv run ruff check .
      
      - name: Check formatting with ruff
        run: |
          uv run ruff format --check .
      
      - name: Run tests with pytest
        run: |
          uv run pytest -v --tb=short

  cloudflare-frontend-and-worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
          pnpm --version

      - name: Install Cloudflare test dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run Cloudflare integration tests
        run: |
          pnpm test

      - name: Validate Worker bundle
        run: |
          pnpm dlx wrangler deploy --dry-run --config worker/wrangler.toml
