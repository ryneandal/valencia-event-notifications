<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Valencia Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-white min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <span
                        class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500">
                        Valencia Events
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <img class="h-8 w-8 rounded-full ring-2 ring-slate-700" src="{{ user.picture }}"
                            alt="{{ user.name }}">
                        <span class="text-sm font-medium text-slate-300 hidden sm:block">{{ user.name }}</span>
                    </div>
                    <a href="/logout" class="text-sm text-slate-400 hover:text-white transition-colors">Sign out</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-12 px-4 sm:px-6 lg:px-8">

        <div class="bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700">
            <div class="p-8">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-white">Your Preferences</h2>
                    <span
                        class="text-sm px-3 py-1 rounded-full {{ 'bg-green-900/50 text-green-300 border border-green-700' if is_active else 'bg-yellow-900/50 text-yellow-300 border border-yellow-700' }}">
                        {{ 'Active Subscription' if is_active else 'Paused' }}
                    </span>
                </div>

                <p class="text-slate-400 mb-8">
                    Tell our AI agent what kind of events you love. Be as descriptive as you like!
                </p>

                <form method="POST" action="/dashboard" class="space-y-6">
                    <div>
                        <label for="preferences" class="block text-sm font-medium text-slate-300 mb-2">My
                            Interests</label>
                        <textarea id="preferences" name="preferences" rows="4"
                            class="block w-full rounded-xl bg-slate-900 border-slate-700 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-4 transition-all"
                            placeholder="e.g. I have 2 kids under 10, verify family friendly events. I love jazz music, hiking, and tech meetups. I dislike nightclubs.">{{ preferences }}</textarea>
                        <p class="mt-2 text-sm text-slate-500">
                            Our AI curator uses this to find the most relevant events for you every day.
                        </p>
                    </div>

                    <div class="flex items-center justify-between pt-6 border-t border-slate-700">
                        <div class="flex items-center h-5">
                            <label class="flex items-center space-x-3 cursor-pointer">
                                <input id="is_active" name="is_active" type="checkbox"
                                    class="w-5 h-5 rounded border-slate-600 bg-slate-700 text-blue-600 focus:ring-blue-500 focus:ring-offset-slate-800 form-checkbox"
                                    {% if is_active %}checked{% endif %}>
                                <span class="text-sm font-medium text-slate-300">Receive Daily Email Digest</span>
                            </label>
                        </div>

                        <button type="submit"
                            class="inline-flex justify-center py-3 px-6 border border-transparent shadow-sm text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>
</body>

</html>
